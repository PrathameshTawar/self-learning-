name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,server]"

    - name: Lint with ruff
      run: |
        ruff check src tests benchmarks

    - name: Run test suite
      run: |
        pytest -v -p no:deepeval tests/

  docker-sandbox:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Build sandbox image
      run: docker build -t evoagent-sandbox -f docker/sandbox.Dockerfile .

    - name: Run container sandbox tests
      run: pytest -v -p no:deepeval tests/unit/test_docker_sandbox.py

    - name: Build the API/worker image and validate the compose file
      run: |
        docker build -t evoagent-app -f docker/app.Dockerfile .
        POSTGRES_PASSWORD=ci EVOAGENT_API_TOKENS=ci docker compose config --quiet

  integration:
    # Postgres + pgvector memory, the Postgres job store, and the Redis queue against real services
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: evoagent_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      EVOAGENT_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/evoagent_test
      EVOAGENT_TEST_REDIS_URL: redis://localhost:6379/0

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,server]"

    - name: Run integration tests
      run: pytest -v -p no:deepeval tests/integration

  training-smoke:
    # Runs the real adapter training loop (unquantized, on CPU) on a tiny random Qwen2 model
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        pip install -e ".[dev]" "transformers>=4.46.0" "peft>=0.13.0" "accelerate>=0.34.0"

    - name: Run training tests
      run: pytest -v -p no:deepeval tests/unit/test_finetune.py
