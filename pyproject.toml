[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evoagent"
version = "0.1.0"
description = "EvoAgent: A Self-Learning Autonomous Coding and Repair Agent"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Prathamesh Taware", email = "tawareprathamesh7@gmail.com" }
]
keywords = [
    "ai-agent",
    "self-learning",
    "autonomous-coding",
    "langgraph",
    "code-repair",
    "machine-learning"
]
dependencies = [
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "click>=8.1.0",
    "rich>=13.7.0",
    "structlog>=24.1.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0"
]

[project.optional-dependencies]
advanced = [
    "langgraph>=0.0.30",
    "langchain-core>=0.1.30",
    "sqlalchemy>=2.0.25",
    "psycopg[binary]>=3.1.18",
    "pgvector>=0.2.5",
    "redis>=5.0.1"
]
server = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "redis>=5.0.1",
    "psycopg[binary,pool]>=3.1.18"
]
# Install torch first with the CUDA build for your driver, e.g.
#   pip install torch --index-url https://download.pytorch.org/whl/cu121
training = [
    "torch>=2.2.0",
    "transformers>=4.46.0",
    "peft>=0.13.0",
    "accelerate>=0.34.0",
    "bitsandbytes>=0.43.0"
]
dev = [
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "pytest-cov>=4.1.0"
]

[project.scripts]
evoagent = "evoagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"
# Vendored QuixBugs programs are benchmark inputs and must stay exactly as published
extend-exclude = ["benchmarks/quixbugs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E741", "E402", "I001", "F401"]
